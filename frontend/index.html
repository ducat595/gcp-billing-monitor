<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCP Billing Monitor</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>GCP Billing Monitor</h1><p>2つの請求先アカウントをまとめて確認</p>
<nav class="billing-links" aria-label="Google Cloud 請求管理">
<a href="https://console.cloud.google.com/billing" target="_blank" rel="noopener noreferrer">Google Cloud 請求管理 ↗</a>
<a href="https://console.cloud.google.com/billing/01F37D-543EF8-154579" target="_blank" rel="noopener noreferrer">Tesla 請求先 ↗</a>
<a href="https://console.cloud.google.com/billing/018D1B-DC0645-FB4431" target="_blank" rel="noopener noreferrer">マイマップ 請求先 ↗</a>
</nav></header>
<section class="settings"><label>API URL <input id="url" placeholder="https://example.com/api/billing"></label><label>閲覧トークン <input id="token" type="password" autocomplete="off"></label><button id="load">料金を取得</button><small>認証情報はブラウザに保存しません。</small></section>
<section class="summary">
<div class="panel"><h2>当月合計</h2><strong id="total">未取得</strong></div>
<div class="panel"><h2>予算信号</h2><div id="budget-signal" class="budget-signal unknown" role="status" aria-live="polite"><span class="signal-light" aria-hidden="true"></span><strong id="signal-label">判定待ち</strong></div><p id="signal-detail">料金取得後に判定します</p><small>緑：80%未満 / 黄：80～100% / 赤：100%超</small></div>
<div class="panel"><h2>最終取得</h2><span id="updated">—</span></div>
</section>
<section id="accounts" class="accounts"></section><p id="message" role="status"></p>
</main><script src="app.js"></script></body></html>
